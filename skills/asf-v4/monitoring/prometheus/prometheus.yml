global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'anfsf-monitor'

scrape_configs:
  # Prometheus 自监控
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          instance: 'prometheus'

  # Node Exporter - 系统指标
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          instance: 'node-exporter'

  # Grafana 监控
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
        labels:
          instance: 'grafana'

  # Redis Exporter
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          instance: 'redis'

  # ANFSF 应用指标
  - job_name: 'anfsf-app'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:8000']
        labels:
          instance: 'anfsf-backend'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: host.docker.internal:8000

  # Vitest 测试结果
  - job_name: 'vitest-results'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:9091']
        labels:
          instance: 'vitest'

# 告警规则
rule_files:
  - 'alerts.yml'

# 告警管理器
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
