# ASF V4.0 Role KPI Policy Configuration
# Version: v0.8.5

# KPI thresholds for alerts and triggers
thresholds:
  # Queue pressure (queue_len / maxQueueLen)
  queuePressure:
    warning: 0.8
    critical: 1.2    # Triggers Split suggestion

  # Failure rate (failed / total)
  failureRate:
    warning: 0.15    # 15%
    critical: 0.25   # 25%

  # Rework rate (reworked / total)
  reworkRate:
    warning: 0.2     # 20%
    critical: 0.3    # 30%

  # Conflict rate (conflicts / changes)
  conflictRate:
    warning: 0.1     # 10%
    critical: 0.15   # 15% - Triggers ownership tightening

  # Drift index (JSD between task/capability distribution)
  driftIndex:
    warning: 0.25
    critical: 0.35   # Triggers Reassign suggestion

  # Health score (0-100)
  healthScore:
    good: 80
    warning: 60
    critical: 40

# KPI → Action policies
policies:
  # High queue pressure → suggest role split
  - name: queue_pressure_split
    condition:
      metric: queuePressure
      operator: ">"
      threshold: 1.2
      duration: 3    # Consecutive periods
    action: suggest_split
    priority: high
    message: "Role {roleId} has critical queue pressure ({value}). Consider splitting responsibilities."

  # High drift + failure → suggest reassignment
  - name: drift_reassign
    condition:
      and:
        - metric: driftIndex
          operator: ">"
          threshold: 0.35
        - metric: failureRate
          operator: ">"
          threshold: 0.2
    action: suggest_reassign
    priority: high
    message: "Role {roleId} shows capability drift ({driftIndex}) with elevated failures ({failureRate}). Review task assignments."

  # High conflict rate → tighten ownership
  - name: conflict_tighten
    condition:
      metric: conflictRate
      operator: ">"
      threshold: 0.15
    action: alert
    priority: medium
    message: "Role {roleId} has high conflict rate ({value}%). Consider tightening ownership rules."

  # High rework rate → review DoD
  - name: rework_review
    condition:
      metric: reworkRate
      operator: ">"
      threshold: 0.25
    action: alert
    priority: medium
    message: "Role {roleId} has high rework rate ({value}%). Review DoD gates and quality processes."

  # High failure rate → investigate
  - name: failure_investigate
    condition:
      metric: failureRate
      operator: ">"
      threshold: 0.25
    action: alert
    priority: high
    message: "Role {roleId} has high failure rate ({value}%). Investigate root causes."

# Time windows for KPI calculation
windows:
  - 30m    # Short-term monitoring
  - 2h     # Shift-based
  - 1d     # Daily reporting
  - 7d     # Weekly trends

# Export configuration
export:
  prometheus:
    enabled: true
    prefix: role_kpi
  jsonl:
    enabled: true
    path: /var/log/openclaw/kpi-timeseries.jsonl
  snapshot:
    enabled: true
    path: /var/log/openclaw/kpi-snapshot.json
    interval: 1h

# Dashboard configuration
dashboard:
  refreshInterval: 30s
  defaultWindow: 1d
  showTrends: true
