# ASF V4.0 Interface Budget Configuration
# Version: v0.8.5

# Edge type costs for cross-role dependencies
# Higher cost = higher communication/collaboration overhead
edgeCosts:
  depends_on: 1.0    # Simple dependency
  calls: 1.2         # API/function calls
  updates: 1.4       # Data updates (state changes)
  implements: 0.8    # Interface implementation
  validates: 1.3     # Validation relationships
  subscribes: 1.1    # Event subscriptions
  owns: 0.5          # Ownership (internal)

# Contract type costs
# Higher cost = higher stability impact when changed
contractCosts:
  OpenAPI: 1.6       # External-facing API
  DBSchema: 1.7      # Database schema (highest impact)
  UIProps: 1.2       # UI component props
  EventSchema: 1.5   # Event schemas
  ConfigSchema: 1.1  # Configuration schemas

# Node type risk weights
nodeRiskWeights:
  AuthModule: 1.8
  PaymentService: 1.9
  DBSchema: 1.7
  APIContract: 1.5
  Probe: 1.4
  EventSchema: 1.3
  Service: 1.2
  ConfigSchema: 1.1
  UIComponent: 1.0
  Utility: 0.8

# Risk score thresholds for multipliers
riskThresholds:
  high: 70      # ×1.5 multiplier
  medium: 40    # ×1.2 multiplier
  # low: 0      # ×1.0 multiplier

# Budget limits
budget:
  totalPerRole: 100
  warningThreshold: 0.7    # 70% utilization
  criticalThreshold: 0.9   # 90% utilization

# Healthy limits
healthy:
  maxCrossRoleEdges: 20
  maxContractTouches: 10
