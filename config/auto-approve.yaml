# ASF V4.0 Contract Auto-Approve Configuration
# Version: v0.8.5

# Enable/disable auto-approve globally
enabled: true

# Auto-approve rules by contract type
rules:
  # OpenAPI contracts
  - contractType: OpenAPI
    enabled: true
    conditions:
      # Only allow adding optional fields
      onlyAddOptionalFields: true
      # No type changes allowed
      noTypeChanges: true
      # No constraint tightening
      noConstraintTighten: true
      # Maximum risk score
      riskScoreBelow: 20
    autoApprove: true
    description: "Auto-approve low-risk OpenAPI changes (optional fields only)"

  # DB Schema contracts
  - contractType: DBSchema
    enabled: true
    conditions:
      # Only allow adding optional columns
      onlyAddOptionalFields: true
      # No type changes
      noTypeChanges: true
      # No constraint tightening
      noConstraintTighten: true
      # Stricter risk threshold for DB
      riskScoreBelow: 15
    autoApprove: true
    description: "Auto-approve low-risk DB schema changes (optional columns only)"

  # UI Props contracts
  - contractType: UIProps
    enabled: true
    conditions:
      # Only allow adding fields (not removing)
      onlyAddFields: true
      # No removed fields
      noRemovedFields: true
      # Moderate risk threshold
      riskScoreBelow: 15
    autoApprove: true
    description: "Auto-approve additive UI props changes"

  # Event Schema contracts
  - contractType: EventSchema
    enabled: true
    conditions:
      # Only allow adding optional fields
      onlyAddOptionalFields: true
      # No removed fields (breaks consumers)
      noRemovedFields: true
      # Moderate risk threshold
      riskScoreBelow: 20
    autoApprove: true
    description: "Auto-approve additive event schema changes"

  # Config Schema contracts
  - contractType: ConfigSchema
    enabled: true
    conditions:
      # Allow adding fields
      onlyAddOptionalFields: true
      # Moderate risk threshold
      riskScoreBelow: 25
    autoApprove: true
    description: "Auto-approve low-risk config changes"

# Strict mode (disables all auto-approve)
strictMode:
  enabled: false
  # When enabled, all contracts require manual approval
  # Useful for production deployments or regulated environments

# Role-based overrides
roleOverrides:
  # Platform team has stricter rules
  - roles: ["platform-team"]
    rules:
      - contractType: "*"
        riskScoreBelow: 10
        autoApprove: false

  # Frontend team has relaxed UI props rules
  - roles: ["frontend-team"]
    rules:
      - contractType: "UIProps"
        riskScoreBelow: 25
        autoApprove: true

# Audit logging
audit:
  enabled: true
  logApprovals: true
  logRejections: true
  path: /var/log/openclaw/auto-approve-audit.log

# Notifications
notifications:
  enabled: true
  # Notify on auto-approval
  onAutoApprove: false
  # Always notify on manual approval
  onManualApprove: true
  # Notify on rejection
  onReject: true
  channels:
    - type: slack
      webhook: ${SLACK_WEBHOOK_URL}
    - type: email
      recipients: ["architects@company.com"]
