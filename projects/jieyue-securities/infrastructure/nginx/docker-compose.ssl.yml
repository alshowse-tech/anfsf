version: '3.8'

services:
  # Nginx with SSL
  nginx:
    image: nginx:alpine
    container_name: jieyue-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/ssl:/etc/nginx/ssl:ro
      - ./infrastructure/nginx/certbot:/var/www/certbot:rw
    depends_on:
      - backend
      - frontend
    networks:
      - jieyue-network
    restart: unless-stopped

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jieyue-backend
    environment:
      - DATABASE_URL=mysql+pymysql://root:password@db:3306/jieyue
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-secret-key-change-in-production}
      - JWT_ALGORITHM=HS256
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=30
      - JWT_REFRESH_TOKEN_EXPIRE_DAYS=7
    depends_on:
      - db
      - redis
    networks:
      - jieyue-network
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jieyue-frontend
    environment:
      - NEXT_PUBLIC_API_URL=/api
    depends_on:
      - backend
    networks:
      - jieyue-network
    restart: unless-stopped

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: jieyue-db
    environment:
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_DATABASE=jieyue
      - MYSQL_USER=jieyue
      - MYSQL_PASSWORD=password
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - jieyue-network
    restart: unless-stopped

  # Redis
  redis:
    image: redis:alpine
    container_name: jieyue-redis
    volumes:
      - redis_data:/data
    networks:
      - jieyue-network
    restart: unless-stopped

  # Certbot for Let's Encrypt
  certbot:
    image: certbot/certbot
    container_name: jieyue-certbot
    volumes:
      - ./infrastructure/nginx/certbot:/var/www/certbot:rw
      - ./infrastructure/nginx/ssl:/etc/letsencrypt:rw
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - jieyue-network

networks:
  jieyue-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
