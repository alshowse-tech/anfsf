# 捷阅证券信息助手 - Docker Compose 配置
version: '3.8'

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: jieyue-mysql
    environment:
      MYSQL_ROOT_PASSWORD: jieyue2026
      MYSQL_DATABASE: jieyue_securities
      MYSQL_USER: jieyue
      MYSQL_PASSWORD: jieyue2026
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infrastructure/docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306"
    networks:
      - jieyue-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-piejieyue2026"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: jieyue-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - jieyue-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jieyue-backend
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql+pymysql://root:jieyue2026@mysql:3306/jieyue_securities
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TIKHUB_API_KEY: ${TIKHUB_API_KEY:-demo_key}
      VOLCANO_ACCESS_KEY: ${VOLCANO_ACCESS_KEY:-demo_key}
      VOLCANO_SECRET_KEY: ${VOLCANO_SECRET_KEY:-demo_secret}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-demo_key}
      APP_ENV: development
      DEBUG: "True"
    ports:
      - "8000:8000"
    networks:
      - jieyue-network
    volumes:
      - ./backend/src:/app/src:ro
    restart: unless-stopped

  # 前端服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jieyue-frontend
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
      NODE_ENV: production
    ports:
      - "3000:3000"
    networks:
      - jieyue-network
    restart: unless-stopped

  # 数据库初始化
  db_init:
    image: mysql:8.0
    container_name: jieyue-db-init
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: jieyue2026
      MYSQL_DATABASE: jieyue_securities
    volumes:
      - ./infrastructure/docker/init.sql:/init.sql
    command: >
      bash -c "
      until mysql -h mysql -u root -piejieyue2026 -e 'SELECT 1' 2>/dev/null; do
        echo 'Waiting for MySQL...'
        sleep 2
      done
      && echo 'MySQL is ready'
      && mysql -h mysql -u root -piejieyue2026 jieyue_securities < /init.sql
      && echo 'Database initialized'
      "
    networks:
      - jieyue-network

networks:
  jieyue-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
