# Logstash Docker Configuration
version: '7.17.0'

# Pipeline settings
pipeline.workers: 2
pipeline.batch.size: 125
pipeline.batch.delay: 50

# Memory settings
heap.size: 1g

# Path settings
path.data: /usr/share/logstash/data
path.logs: /usr/share/logstash/logs

# HTTP API settings
http.host: "0.0.0.0"
http.port: 9600

# Logging
log.level: info
log.format: json
