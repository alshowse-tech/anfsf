# Logstash Pipeline Configuration for JieYue Securities

input {
  # Application logs (Filebeat)
  beats {
    port => 5044
  }
  
  # HTTP logs (Nginx)
  file {
    path => "/var/log/nginx/*.log"
    start_position => "beginning"
  }
  
  # Backend logs (Python/FastAPI)
  file {
    path => "/var/log/jieyue/backend/*.log"
    start_position => "beginning"
    codec => json
  }
}

filter {
  # Parse backend JSON logs
  if [service] == "backend" {
    json {
      source => "message"
    }
  }
  
  # Parse Nginx access logs
  if [type] == "nginx-access" {
    grok {
      match => {
        "message" => '%{IPORCLIENT:client_ip} - %{USER:remote_user} \[%{HTTPDATE:timestamp}\] "%{WORD:verb} %{DATA:request} HTTP/%{NUMBER:http_version}" %{NUMBER:response_code} %{NUMBER:bytes_sent} "%{DATA:referrer}" "%{DATA:user_agent}"'
      }
    }
    
    # Parse response time
    if [request_time] {
      mutate {
        convert => { "request_time" => "float" }
      }
    }
  }
  
  # Parse backend error logs
  if [service] == "backend" and [level] in ["ERROR", "CRITICAL"] {
    mutate {
      add_tag => ["error"]
    }
  }
  
  # Add environment tag
  mutate {
    add_field => { "environment" => "production" }
    add_field => { "application" => "jieyue-securities" }
  }
  
  # Parse timestamps
  date {
    match => [ "timestamp", "dd/MMM/YYYY:HH:mm:ss Z", "ISO8601" ]
    target => "@timestamp"
  }
  
  # Remove unnecessary fields
  mutate {
    remove_field => [ "host", "agent" ]
  }
}

output {
  # Send to Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "jieyue-logs-%{+YYYY.MM.dd}"
  }
  
  # Debug output (disable in production)
  # stdout { codec => rubydebug }
}
