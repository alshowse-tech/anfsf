# 捷阅证券信息助手 - Alertmanager 配置
global:
  # 默认通知配置
  resolve_timeout: 5m
  
  # 钉钉 webhook 配置 (示例)
  # dingtalk_configs:
  #   - url: 'https://oapi.dingtalk.com/robot/send?access_token=YOUR_TOKEN'
  #     secret: 'YOUR_SECRET'

# 模板文件
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# 告警路由
route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default-receiver'
  
  # 子路由
  routes:
    - match:
        severity: critical
      receiver: 'critical-receiver'
      group_wait: 10s
      repeat_interval: 1h
    
    - match:
        severity: warning
      receiver: 'warning-receiver'
      group_wait: 1m
      repeat_interval: 2h

# 告警接收器
receivers:
  # 默认接收器
  - name: 'default-receiver'
    # 可以配置多种通知方式
    # email_configs:
    #   - to: 'alerts@example.com'
    #     from: 'alertmanager@example.com'
    #     smarthost: 'smtp.example.com:587'
    #     auth_username: 'alertmanager@example.com'
    #     auth_password: 'PASSWORD'
    webhook_configs:
      - url: 'http://localhost:5001/alerts'
        send_resolved: true

  # 严重告警接收器
  - name: 'critical-receiver'
    webhook_configs:
      - url: 'http://localhost:5001/alerts/critical'
        send_resolved: true
    # 钉钉通知
    # dingtalk_configs:
    #   - url: 'https://oapi.dingtalk.com/robot/send?access_token=YOUR_TOKEN'
    #     send_resolved: true
    #     title: '🚨 严重告警'
    #     message: '{{ template "dingtalk.html" . }}'

  # 警告接收器
  - name: 'warning-receiver'
    webhook_configs:
      - url: 'http://localhost:5001/alerts/warning'
        send_resolved: true

# 告警抑制规则
inhibit_rules:
  # 如果实例已经 down 了，就不要发送其他告警
  - source_match:
      alertname: 'InstanceDown'
    target_match:
      alertname: '.+'
    equal: ['instance']

