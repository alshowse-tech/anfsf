version: '3.8'

services:
  neo4j:
    image: neo4j:5.15.0
    container_name: sparkpath-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/SparkPath2026!
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    networks:
      - sparkpath-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7474"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  redis:
    image: redis:7.2-alpine
    container_name: sparkpath-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass SparkPath2026!
    volumes:
      - redis-data:/data
    networks:
      - sparkpath-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  sparkpath-network:
    driver: bridge

volumes:
  neo4j-data:
  neo4j-logs:
  redis-data:
